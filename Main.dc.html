  ];

  // HORSE EASTER EGG: a 12-frame sprite that gallops while you scroll and runs across the footer.
  horseRef = (el) => { this.horseEl = el || null; };
  horseFootRef = (el) => { this.horseFoot = el || null; };
  horseStart() {
    this.hFrame = 0; this.hLast = 0; this.hActive = 0; this.hRaf = null;
    this.hReduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.onHorseScroll = () => {
      this.hActive = performance.now();
      this.horsePos();
      if (!this.hRaf && !this.hReduce) this.hRaf = requestAnimationFrame(this.horseTick);
    };
    document.addEventListener('scroll', this.onHorseScroll, true);
    window.addEventListener('resize', this.onHorseScroll);
    setTimeout(() => this.horsePos(), 0);
  }
  horseStop() {
    document.removeEventListener('scroll', this.onHorseScroll, true);
    window.removeEventListener('resize', this.onHorseScroll);
    if (this.hRaf) cancelAnimationFrame(this.hRaf);
  }
  horseTick = (t) => {
    if (t - this.hLast > 66) {
      this.hLast = t;
      this.hFrame = (this.hFrame + 1) % 12;
      if (this.horseEl) this.horseEl.style.backgroundPosition = (this.hFrame / 11 * 100).toFixed(3) + '% 0';
    }
    this.hRaf = (t - this.hActive < 240) ? requestAnimationFrame(this.horseTick) : null;
  };
  horsePos() {
    const f = this.horseFoot, h = this.horseEl;
    if (!f || !h) return;
    const r = f.getBoundingClientRect();
    const vh = window.innerHeight || document.documentElement.clientHeight;
    const p = Math.min(1, Math.max(0, (vh - r.top) / Math.max(1, r.height)));
    const travel = Math.max(0, f.clientWidth - h.offsetWidth);
    h.style.transform = 'translateX(' + (p * travel).toFixed(1) + 'px)';
  }

  componentDidMount() {
    this.horseStart();
    this.timers = {};
    this.lastType = 'mouse';
    this.mq = window.matchMedia('(max-aspect-ratio: 1/1)');
    this.onMq = () => this.setState({ mobile: this.mq.matches });
    this.onMq();
    if (this.mq.addEventListener) this.mq.addEventListener('change', this.onMq);
    else if (this.mq.addListener) this.mq.addListener(this.onMq);
  }

  // DOT GRAPHIC: ~2800 dots traced from the design. Hovering launches the nearby dots outward like
  // particles; after a moment each one glides back to its place. Positions live in the uploaded
  // dots2.json in desktop design units ({ small: [x,y,...], big: [x,y,r,...], size }).
  DOTS_URL = 'assets/367905197ebea72d24a5b7100728124d.json';
  dotsRef = (el) => {
    if (!el || this.dotsEl === el) return;
    this.dotsEl = el;
    if (this.dotsStarted) { this.dotsResize(); this.dotsKick(); return; }
    this.dotsStarted = true;
    this.dotsT0 = performance.now();
    this.dotsReduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.onDotsResize = () => { this.dotsResize(); this.dotsKick(); };
    window.addEventListener('resize', this.onDotsResize);
    fetch(this.DOTS_URL).then((r) => r.json()).then((d) => {
      this.dotsSrc = d;
      this.dotsBuild();
      this.dotsResize(); this.dotsKick();
    }).catch(() => {});
  };
  // home positions in stage units for the current layout (desktop 2000 x 1414, mobile 1000 x 2000)
  dotsBuild() {
    const d = this.dotsSrc, mob = !!this.state.mobile;
    if (!d) return;
    const ns = Math.floor(d.small.length / 2), nb = Math.floor((d.big || []).length / 3), n = ns + nb;
    const P = new Float32Array(n * 8);
    // mobile: same composition scaled to 0.55 and moved down (matches the script lettering)
    const k = mob ? 0.55 : 1, X = mob ? -49.5 : 0, Y = mob ? 380 : 0, grow = mob ? 1.45 : 1;
    const put = (i, x, y, sz) => {
      const hx = X + k * x, hy = Y + k * y, o = i * 8;
      P[o] = hx; P[o + 1] = hy; P[o + 2] = hx; P[o + 3] = hy; P[o + 7] = sz;
    };
    for (let i = 0; i < ns; i++) put(i, d.small[2 * i], d.small[2 * i + 1], (d.size || 4.2) * k * grow);
    for (let j = 0; j < nb; j++) put(ns + j, d.big[3 * j], d.big[3 * j + 1], -2 * d.big[3 * j + 2] * k * grow); // negative = round dot
    this.dots = { n: n, P: P, mob: mob, W: mob ? 1000 : 2000 };
  }
  dotsResize() {
    const c = this.dotsEl;
    if (!c) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2), w = c.clientWidth, h = c.clientHeight;
    c.width = Math.max(1, Math.round(w * dpr)); c.height = Math.max(1, Math.round(h * dpr));
    this.dotsPx = w; this.dotsDpr = dpr;
    this.dotsDirty = true;
  }
  onDotsMove = (e) => {
    if (!this.dotsEl || !this.dots) return;
    const r = this.dotsEl.getBoundingClientRect();
    if (!r.width) return;
    const W = this.dots.W;
    this.ptr = { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.width * W };
    this.dotsKick();
  };
  onDotsLeave = () => { this.ptr = null; };
  dotsKick() { if (!this.dotsRaf) this.dotsRaf = requestAnimationFrame(this.dotsTick); }
  dotsTick = () => {
    this.dotsRaf = null;
    const c = this.dotsEl;
    if (this.dotsSrc && (!this.dots || this.dots.mob !== !!this.state.mobile)) this.dotsBuild();
    const D = this.dots;
    if (!D || !c) return;
    const now = (performance.now() - this.dotsT0) / 1000;
    const P = D.P, p = this.dotsReduce ? null : this.ptr, R = D.mob ? 60 : 80, R2 = R * R;
    let moving = false;
    for (let i = 0; i < D.n; i++) {
      const o = i * 8;
      let x = P[o + 2], y = P[o + 3], vx = P[o + 4], vy = P[o + 5];
      const hx = P[o], hy = P[o + 1];
      // launch: only dots sitting (nearly) at home can be hit
      if (p && now >= P[o + 6]) {
        const dx = x - p.x, dy = y - p.y, d2 = dx * dx + dy * dy;
        if (d2 < R2 && Math.abs(x - hx) + Math.abs(y - hy) < 6) {
          const d = Math.sqrt(d2) || 0.001, a = Math.atan2(dy, dx) + (Math.random() - 0.5) * 1.1;
          const sp = (6 + (1 - d / R) * 16 + Math.random() * 10) * (D.mob ? 0.6 : 1);
          vx = Math.cos(a) * sp; vy = Math.sin(a) * sp;
          P[o + 6] = now + 0.45 + Math.random() * 0.7; // time spent flying before heading home
        }
      }
      if (now < P[o + 6]) { vx *= 0.93; vy *= 0.93; vy += 0.05; }            // free flight with drag
      else { vx = (vx + (hx - x) * 0.045) * 0.84; vy = (vy + (hy - y) * 0.045) * 0.84; } // glide home
      x += vx; y += vy;
      P[o + 2] = x; P[o + 3] = y; P[o + 4] = vx; P[o + 5] = vy;
      if (now < P[o + 6] || Math.abs(vx) > 0.02 || Math.abs(vy) > 0.02 || Math.abs(hx - x) > 0.05 || Math.abs(hy - y) > 0.05) moving = true;
    }
    const ctx = c.getContext('2d'), s = (this.dotsPx || c.clientWidth) / D.W * (this.dotsDpr || 1);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.fillStyle = '#262626';
    for (let i = 0; i < D.n; i++) {
      const o = i * 8, z = P[o + 7];
      if (z > 0) { const sz = Math.max(1, z * s); ctx.fillRect(P[o + 2] * s - sz / 2, P[o + 3] * s - sz / 2, sz, sz); }
      else { ctx.beginPath(); ctx.arc(P[o + 2] * s, P[o + 3] * s, Math.max(1, -z * s / 2), 0, 6.2832); ctx.fill(); }
    }
    if (moving || this.dotsDirty || this.ptr) { this.dotsDirty = false; this.dotsRaf = requestAnimationFrame(this.dotsTick); }
  };
  // Mobile placement derived from the desktop one: the composition is scaled to 0.55 and moved down.
  mob(r, isItem) {
    const k = 0.55;
    const o = { x: Math.round(k * (r.x - 90)), y: Math.round(k * r.y + 380), rot: r.rot || 0 };
    if (isItem) {
      o.w = Math.round(r.w * 0.75); if (r.h) o.h = Math.round(r.h * 0.75); if (r.fs) o.fs = Math.round(r.fs * 0.8);
      o.x = Math.max(10, Math.min(990 - o.w, o.x));
    } else {
      o.w = Math.max(90, Math.round(k * r.w)); o.h = Math.max(90, Math.round(k * r.h));
    }
    return o;
  }
  overlaps(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

  componentWillUnmount() {
    if (this.dotsRaf) cancelAnimationFrame(this.dotsRaf);
    if (this.onDotsResize) window.removeEventListener('resize', this.onDotsResize);
    this.horseStop();
    if (this.mq) {
      if (this.mq.removeEventListener) this.mq.removeEventListener('change', this.onMq);
      else if (this.mq.removeListener) this.mq.removeListener(this.onMq);
    }
    Object.keys(this.timers || {}).forEach((k) => clearTimeout(this.timers[k]));
  }

  setOpen(id, val, exclusive) {
    const next = exclusive ? {} : Object.assign({}, this.state.open);
    if (val) next[id] = true; else delete next[id];
    this.setState({ open: next });
  }

  show(id) {
    if (this.timers[id]) { clearTimeout(this.timers[id]); this.timers[id] = null; }
    if (!this.state.open[id]) this.setOpen(id, true, false);
  }

  hide(id, linger) {
    if (this.timers[id]) clearTimeout(this.timers[id]);
    this.timers[id] = setTimeout(() => { this.timers[id] = null; this.setOpen(id, false, false); }, linger || 0);
  }

  renderVals() {
    const mob = this.state.mobile;
    const open = this.state.open;
    const zones = [];
    const reveals = [];
    const place = (z) => mob ? (z.m || this.mob(z.d, false)) : z.d;
    const named = this.zonesData.filter((z) => z.id[0] === 'z').map(place);
    this.zonesData.forEach((z) => {
      const p = place(z);
      if (z.id[0] === 'x' && named.some((n) => this.overlaps(p, n))) return; // named zones win where they overlap
      const isOpen = !!open[z.id];
      zones.push({
        id: z.id, label: z.label, x: p.x, y: p.y, w: p.w, h: p.h, expanded: isOpen,
        down: (e) => { this.lastType = e.pointerType || 'mouse'; },
        enter: (e) => { if (e.pointerType === 'mouse' || e.pointerType === 'pen') this.show(z.id); },
        leave: (e) => { if (e.pointerType === 'mouse' || e.pointerType === 'pen') this.hide(z.id, z.linger); },
        click: (e) => {
          if (e.detail !== 0 && this.lastType === 'mouse') return;
          this.setOpen(z.id, !isOpen, true);
        },
        focus: () => this.show(z.id),
        blur: () => this.hide(z.id, 0)
      });
      z.items.forEach((it, k) => {
        const q = mob ? (it.m || this.mob(it.d, true)) : it.d;
        const isText = it.kind === 'text';
        reveals.push({
          key: z.id + k,
          cls: isOpen ? 'on' : '',
          hidden: !isOpen,
          x: q.x, y: q.y, w: q.w,
          h: (isText || it.src) ? 'auto' : 'calc(var(--u) * ' + q.h + ')',
          rot: q.rot || 0,
          delay: it.delay || 0,
          isText: isText,
          isImg: !isText && it.kind !== 'video' && !!it.src,
          isVid: it.kind === 'video' && !!it.src,
          poster: it.poster || '',
          isPh: !isText && !it.src,
          src: it.src || '',
          tone: it.tone || 'black',
          caption: it.caption || '',
          text: it.text || '',
          fs: q.fs || 40,
          color: it.color || '#000',
          align: it.align || 'left'
        });
      });
    });
    return {
      stackCls: this.props.stacked ? 'stacked' : '', lnHome: this.props.stacked ? '#home' : 'Main.dc.html', lnProjects: this.props.stacked ? '#projects' : 'Projects.dc.html', lnJen: this.props.stacked ? '#jennieration' : 'Jennieration.dc.html', lnAbout: this.props.stacked ? '#about' : 'About.dc.html', zones: zones, reveals: reveals, horseRef: this.horseRef, horseFootRef: this.horseFootRef,
      dotsRef: this.dotsRef, onDotsMove: this.onDotsMove, onDotsLeave: this.onDotsLeave };
  }
}
